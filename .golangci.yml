# Options for analysis running
# More info could be found at https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - copyloopvar
    - govet
    - ineffassign
    - makezero
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - gosec
  settings:
    staticcheck:
      checks: [ "all", "-SA1019", "-SA1029", "-ST1000", "-ST1003" ]
    gosec:
      excludes: [ "G204", "G301", "G302", "G304", "G306", "G601", "G101" ]
      config:
        global:
          nosec: true

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
